plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.local.impression'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.local.impression'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signée avec la clé de débogage locale : suffisant pour une installation manuelle.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
